<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Qobuz 앱 링크 시험 2</title>
<style>
:root{--bg:#0e0f1c;--card:#181a2e;--ink:#ecebf5;--sub:#9d9ab8;--acc:#c9b8ff}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:21px;margin:0 0 4px} h2{font-size:17px;margin:26px 0 4px}
p{color:var(--sub);font-size:14px;margin:0 0 14px}
.a{background:var(--card);border-radius:14px;padding:13px 15px;margin-bottom:10px}
.a b{display:block;margin-bottom:8px;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row a{padding:8px 11px;border-radius:10px;font-size:13.5px;font-weight:700;background:var(--acc);color:var(--bg);text-decoration:none}
.row a.web{background:transparent;color:var(--acc);border:1px solid var(--acc)}
</style>
</head>
<body>
<main>
<h1>Qobuz 앱 링크 시험 2</h1>
<p>각 버튼을 눌러 보고, 어떤 번호가 앱에서 원하는 앨범·검색 결과를 여는지 알려 주세요.</p>

<h2>A. 바코드로 만든 앨범 번호</h2>
<p>오래된 DG·Decca·Philips·Archiv 음반은 바코드에서 번호가 나옵니다. 앨범이 바로 열리면 성공.</p>
<div id="ids"></div>

<h2>B. 검색어로 열기 (Roon이 찾은 정확한 제목)</h2>
<p>Qobuz 앱이 검색 결과를 보여 주면 성공. 몇 번 버튼이 되는지 알려 주세요.</p>
<div id="search"></div>
</main>
<script>
const IDS=[["Haydn: Sturm & Drang · Pinnock (확인됨)","0002894637312"],["Haydn 90 & 93 · Brüggen","0002894832347"],["Haydn Symphonies Vol.5 · Hogwood","0002894330122"],["Haydn Paris · Kuijken (안 될 것 같음)","0072435616595"]];
const Q=[["Graun · Haselböck","Graun: Violin Concertos / Viola Da Gamba Concerto Wiener Akademie"],["Abel · Schneider","Abel: Flute Concertos Karl Kaiser La Stagione"]];
const e=s=>encodeURIComponent(s);
document.getElementById('ids').innerHTML=IDS.map(([n,id])=>`<div class="a"><b>${n}</b><div class="row"><a href="qobuzapp://album/${id}">앱으로 열기</a><a class="web" href="https://open.qobuz.com/album/${id}">웹</a></div></div>`).join('');
document.getElementById('search').innerHTML=Q.map(([n,q])=>`<div class="a"><b>${n}</b><div class="row">
<a href="qobuzapp://search?q=${e(q)}">1</a>
<a href="qobuzapp://search/${e(q)}">2</a>
<a href="qobuzapp://search/albums/${e(q)}">3</a>
<a href="qobuzapp://search?query=${e(q)}">4</a>
<a class="web" href="https://open.qobuz.com/search?q=${e(q)}">5 웹</a>
<a class="web" href="https://play.qobuz.com/search?q=${e(q)}">6 웹</a></div></div>`).join('');
</script>
</body>
</html>

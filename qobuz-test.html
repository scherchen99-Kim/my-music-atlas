<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Qobuz 앱 링크 시험</title>
<style>
:root{--bg:#0e0f1c;--card:#181a2e;--ink:#ecebf5;--sub:#9d9ab8;--acc:#c9b8ff}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:21px;margin:0 0 6px}
p{color:var(--sub);font-size:14px;margin:0 0 20px}
.a{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.a b{display:block;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row a,.row button{all:unset;cursor:pointer;padding:9px 12px;border-radius:10px;font-size:14px;font-weight:700;background:var(--acc);color:var(--bg)}
.row a.web{background:transparent;color:var(--acc);border:1px solid var(--acc)}
#log{margin-top:18px;font-size:13px;color:var(--sub)}
</style>
</head>
<body>
<main>
<h1>Qobuz 앱 링크 시험</h1>
<p>아이폰에서 각 버튼을 눌러 보세요. ① 앱 링크만 · ② 앱 → 안 되면 웹(1.5초) · ③ 웹 링크</p>
<div id="list"></div>
<div id="log"></div>
</main>
<script>
const A=[['Stamitz · Hogwood','0002894759116'],['Graun · Haselböck','x35wjrg9g2sua'],["Haydn L'Impatiente · Chauvin",'qn2g2oxvwt9pc'],['Abel Flute · Schneider','p6smkir5mc1tc']];
const log=t=>{document.getElementById('log').textContent=t};
function tryApp(id){
 let left=false;const mark=()=>{left=true};
 document.addEventListener('visibilitychange',mark,{once:true});addEventListener('pagehide',mark,{once:true});
 location.href='qobuzapp://album/'+id;
 setTimeout(()=>{if(!left&&!document.hidden){log('앱으로 안 넘어가서 웹으로 엽니다');location.href='https://open.qobuz.com/album/'+id}},1500);
}
document.getElementById('list').innerHTML=A.map(([n,id])=>`<div class="a"><b>${n}</b><div class="row"><a href="qobuzapp://album/${id}">① 앱 링크</a><button type="button" data-id="${id}">② 앱→웹</button><a class="web" href="https://open.qobuz.com/album/${id}">③ 웹</a></div></div>`).join('');
document.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>tryApp(b.dataset.id));
</script>
</body>
</html>
